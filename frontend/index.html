<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#08080A" />
    <link rel="icon" type="image/svg+xml" href="/rhythm-logo-dark.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Anton&family=Geist:wght@400;500;600;700;800&family=Geist+Mono:wght@400;500;600&family=Noto+Nastaliq+Urdu:wght@400&display=swap" rel="stylesheet">
    <title>Rhythm — Activity Tracker</title>
    <script>try{var light=localStorage.getItem("theme")==="light";if(light)document.documentElement.setAttribute("data-theme","light");var icon=document.querySelector('link[rel="icon"]');if(icon)icon.href=light?"/rhythm-logo-light.svg":"/rhythm-logo-dark.svg";var meta=document.querySelector('meta[name="theme-color"]');if(meta)meta.setAttribute("content",light?"#F4F0E8":"#08080A")}catch(e){}</script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
